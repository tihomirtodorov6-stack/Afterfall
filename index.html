<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Летища България 2026</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0B57D0">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3774/3774080.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#f8f9fb}header{background:#fff;padding:10px 14px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{font-weight:800;color:#0B57D0;text-decoration:none;font-size:18px}
.lang{display:flex;gap:4px;flex-wrap:wrap}
.lang button{padding:5px 8px;border:1px solid #ddd;border-radius:20px;background:#fff;cursor:pointer;font-weight:800;font-size:11px}
.lang button.active{background:#0B57D0;color:#fff;border-color:#0B57D0}
.hero{max-width:900px;margin:0 auto;padding:24px 16px}
.grid{max-width:900px;margin:0 auto;padding:0 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:12px;cursor:pointer}
.badge{color:#059669;background:#ecfdf5;padding:2px 6px;border-radius:20px;font-size:11px}
#detail{display:none;max-width:900px;margin:0 auto;padding:16px}
.btn{padding:8px 12px;border:none;background:#eee;border-radius:8px;cursor:pointer;margin-bottom:12px}
</style>
</head>
<body>
<header><a class="logo" href="/">Letishta.bg</a>
<div class="lang">
<button onclick="setLang('bg')" id="b-bg" class="active">BG</button>
<button onclick="setLang('en')" id="b-en">EN</button>
<button onclick="setLang('de')" id="b-de">DE</button>
<button onclick="setLang('ro')" id="b-ro">RO</button>
<button onclick="setLang('tr')" id="b-tr">TR</button>
<button onclick="setLang('gr')" id="b-gr">GR</button>
</div></header>
<div id="home"><div class="hero"><h1 id="h1"></h1><p id="sub" style="color:#555;margin-top:8px;font-size:14px"></p></div><div class="grid" id="list"></div></div>
<div id="detail"></div>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js')}
const T={
bg:{h1:"Такси и безплатен престой 2026",sub:"София, Варна, Бургас, Пловдив - Kiss & Ride",free:"безплатно",btn:"Цени",back:"← Назад"},
en:{h1:"Bulgaria Airport Fees 2026",sub:"Sofia, Varna, Burgas, Plovdiv - Free Kiss & Ride",free:"FREE",btn:"Prices",back:"← Back"},
de:{h1:"Bulgarien Flughafen 2026",sub:"Sofia, Varna, Burgas, Plovdiv",free:"KOSTENLOS",btn:"Preise",back:"← Zurück"},
ro:{h1:"Taxe aeroport Bulgaria 2026",sub:"Sofia, Varna, Burgas, Plovdiv",free:"GRATUIT",btn:"Prețuri",back:"← Înapoi"},
tr:{h1:"Bulgaristan Havalimanı 2026",sub:"Sofya, Varna, Burgaz, Filibe",free:"ÜCRETSİZ",btn:"Fiyat",back:"← Geri"},
gr:{h1:"Τέλη αεροδρομίου 2026",sub:"Σόφια, Βάρνα, Μπουργκάς, Φιλιππούπολη",free:"ΔΩΡΕΑΝ",btn:"Τιμές",back:"← Πίσω"}
};
let L='bg';
const A=[
{id:"sof",code:"SOF",name:{bg:"Летище София",en:"Sofia Airport",de:"Flughafen Sofia",ro:"Aeroport Sofia",tr:"Sofya Havalimanı",gr:"Αεροδρόμιο Σόφιας"},free:{bg:"10 мин безплатно",en:"10 min free",de:"10 Min kostenlos",ro:"10 min gratuit",tr:"10 dk ücretsiz",gr:"10 λεπτά δωρεάν"}},
{id:"var",code:"VAR",name:{bg:"Летище Варна",en:"Varna Airport",de:"Flughafen Varna",ro:"Aeroport Varna",tr:"Varna Havalimanı",gr:"Αεροδρόμιο Βάρνας"},free:{bg:"10 мин безплатно",en:"10 min free",de:"10 Min kostenlos",ro:"10 min gratuit",tr:"10 dk ücretsiz",gr:"10 λεπτά δωρεάν"}},
{id:"boj",code:"BOJ",name:{bg:"Летище Бургас",en:"Burgas Airport",de:"Flughafen Burgas",ro:"Aeroport Burgas",tr:"Burgaz Havalimanı",gr:"Αεροδρόμιο Μπουργκάς"},free:{bg:"10 мин безплатно",en:"10 min free",de:"10 Min kostenlos",ro:"10 min gratuit",tr:"10 dk ücretsiz",gr:"10 λεπτά δωρεάν"}},
{id:"pdv",code:"PDV",name:{bg:"Летище Пловдив",en:"Plovdiv Airport",de:"Flughafen Plovdiv",ro:"Aeroport Plovdiv",tr:"Filibe Havalimanı",gr:"Αεροδρόμιο Φιλιππούπολης"},free:{bg:"15 мин безплатно",en:"15 min free",de:"15 Min kostenlos",ro:"15 min gratuit",tr:"15 dk ücretsiz",gr:"15 λεπτά δωρεάν"}}
];
function setLang(l){L=l;document.querySelectorAll('.lang button').forEach(b=>b.classList.remove('active'));document.getElementById('b-'+l).classList.add('active');document.getElementById('h1').innerText=T[l].h1;document.getElementById('sub').innerText=T[l].sub;render();}
const list=document.getElementById('list'),home=document.getElementById('home'),detail=document.getElementById('detail');
function render(){list.innerHTML="";A.forEach(a=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<b>${a.code}</b><h4 style="margin:4px 0;font-size:13px">${a.name[L]}</h4><span class="badge">${a.free[L]}</span><div style="font-size:10px;color:#666;margin-top:4px">${T[L].btn}</div>`;d.onclick=()=>show(a.id);list.appendChild(d);});}
function show(id){const a=A.find(x=>x.id===id);home.style.display='none';detail.style.display='block';detail.innerHTML=`<button class="btn" onclick="back()">${T[L].back}</button><h2>${a.name[L]} (${a.code})</h2><p><b>${a.free[L]}</b></p>`;}
function back(){detail.style.display='none';home.style.display='block';}
setLang('bg');
</script>
</body>
</html>
