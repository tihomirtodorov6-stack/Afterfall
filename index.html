const list=document.getElementById('list'),home=document.getElementById('home'),detail=document.getElementById('detail');
function render(){list.innerHTML="";AIRPORTS.forEach(a=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<b>${a.code}</b><h4 style="margin:5px 0;font-size:14px">${a.name}</h4><span class="badge">${a.free}</span><div style="font-size:11px;color:#0B57D0;margin-top:6px;font-weight:700">→ Терминали + Карта + €</div>`;d.onclick=()=>show(a.id);list.appendChild(d);});}
function show(id){home.style.display='none';detail.style.display='block';window.scrollTo(0,0);detail.innerHTML=DETAILS[id];}
function back(){detail.style.display='none';home.style.display='block';}
function setLang(l){document.querySelectorAll('.lang button').forEach(b=>b.classList.remove('active'));document.getElementById('b-'+l).classList.add('active');}
