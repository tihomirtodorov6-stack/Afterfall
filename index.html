<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Летища България 2026 - Евро</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0B57D0">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif}
body{background:#f8f9fb;color:#111}
header{background:#fff;padding:10px 14px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}
.logo{font-weight:800;color:#0B57D0;text-decoration:none;font-size:18px}
.lang{display:flex;gap:4px}
.lang button{padding:6px 9px;border:1px solid #ddd;border-radius:20px;background:#fff;cursor:pointer;font-weight:800;font-size:11px}
.lang button.active{background:#0B57D0;color:#fff;border-color:#0B57D0}
.hero{max-width:900px;margin:0 auto;padding:20px 16px}
.grid{max-width:900px;margin:0 auto;padding:0 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:14px;cursor:pointer}
.badge{color:#059669;background:#ecfdf5;padding:4px 8px;border-radius:20px;font-size:11px;font-weight:700}
#detail{display:none;max-width:900px;margin:0 auto;padding:16px}
.btn{padding:9px 16px;border:none;background:#e5e7eb;border-radius:20px;cursor:pointer;margin-bottom:14px;font-weight:700}
.box{background:#fff;border:1px solid #ddd;border-radius:16px;padding:0;overflow:hidden;margin-top:12px}
.box-inner{padding:16px}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0f0f0}
.tag{background:#f3f4f6;padding:2px 8px;border-radius:10px;font-size:11px}
</style>
</head>
<body>
<header><a class="logo" href="/">Letishta.bg</a>
<div class="lang">
<button onclick="setLang('bg')" id="b-bg" class="active">BG</button>
<button onclick="setLang('en')" id="b-en">EN</button>
<button onclick="setLang('de')" id="b-de">DE</button>
<button onclick="setLang('ro')" id="b-ro">RO</button>
<button onclick="setLang('tr')" id="b-tr">TR</button>
<button onclick="setLang('gr')" id="b-gr">GR</button>
</div></header>

<div id="home"><div class="hero"><h1 id="h1"></h1><p id="sub" style="color:#555;margin-top:8px;font-size:13px"></p></div><div class="grid" id="list"></div></div>
<div id="detail"></div>

<script>

{id:"boj",code:"BOJ",name:{bg:"Летище Бургас",en:"Burgas Airport",de:"Flughafen Burgas",ro:"Aeroport Burgas",tr:"Burgaz Havalimanı",gr:"Αεροδρόμιο Μπουργκάς"},free:{bg:"10 мин БЕЗПЛАТНО",en:"10 min FREE",de:"10 Min KOSTENLOS",ro:"10 min GRATUIT",tr:"10 dk ÜCRETSİZ",gr:"10 λεπτά ΔΩΡΕΑΝ"}},
{id:"pdv",code:"PDV",name:{bg:"Летище Пловдив",en:"Plovdiv Airport",de:"Flughafen Plovdiv",ro:"Aeroport Plovdiv",tr:"Filibe Havalimanı",gr:"Αεροδρόμιο Φιλιππούπολης"},free:{bg:"15 мин БЕЗПЛАТНО",en:"15 min FREE",de:"15 Min KOSTENLOS",ro:"15 min GRATUIT",tr:"15 dk ÜCRETSİZ",gr:"15 λεπτά ΔΩΡΕΑΝ"}}
];

const INFO={
sof:{
bg:`<h3>📍 ${T.bg.term}: 2 терминала</h3>
<b>Терминал 1</b> (стар): Wizz Air, Ryanair, чартъри<br>
<b>Терминал 2</b> (нов): Bulgaria Air, Lufthansa, Turkish, Austrian - 90% от полетите<br>
Безплатен шатъл автобус между тях на всеки 30 мин.<br><br>
<h3>💚 KISS & RIDE (безплатно)</h3>
Точно пред Терминал 2, лентата за целувка и тръгване. Взимаш билет от бариерата.<br>
<b>0-10 мин: 0,00 € БЕЗПЛАТНО</b><br>
10-30 мин: 2,56 € (5 лв)<br>
30-60 мин: 5,11 € (10 лв)<br>
След 1 час: 3,07 € / час (6 лв)<br><br>
<h3>🅿️ Паркинги в Евро</h3>
P4 Икономичен: 2,05 €/час, 10,23 €/ден<br>
P5 Дългосрочен: 1,53 €/час, 7,67 €/ден<br>
P3 Премиум до терминала: 3,58 €/час<br><br>
<div style="background:#fef3c7;padding:10px;border-radius:10px"><b>💡 Съвет:</b> Ако чакаш някой - не влизай в Kiss & Ride! Паркирай на P4 (2 €) и го чакай вътре с кафе. На Kiss & Ride камерите глобяват ако стоиш.</div>`,
en:`<h3>📍 Terminals: 2 terminals</h3>
<b>T1</b> (old): Wizz, Ryanair<br><b>T2</b> (new): Main terminal - 90% flights<br>Free shuttle every 30 min<br><br>
<h3>💚 KISS & RIDE</h3>
In front of T2. Take ticket at barrier.<br>
<b>0-10 min: 0.00 € FREE</b><br>10-30 min: 2.56 €<br>30-60 min: 5.11 €<br>After 1h: 3.07 €/h<br><br>
<h3>🅿️ Parking in Euro</h3>
P4 Economy: 2.05 €/h, 10.23 €/day<br>P5 Long: 1.53 €/h, 7.67 €/day<br><br>
<div style="background:#fef3c7;padding:10px;border-radius:10px"><b>💡 Tip:</b> Don't wait in Kiss & Ride! Park at P4 (2€) and wait inside. Cameras fine you if you stay.</div>`
},
var:{
bg:`<h3>📍 1 Терминал</h3>Малко летище, всичко на едно място.<br><br>
<h3>💚 KISS & RIDE</h3>
<b>0-10 мин: 0,00 € БЕЗПЛАТНО</b><br>10-30 мин: 2,05 €<br>30-60 мин: 4,09 €<br><br>
<h3>🅿️ Паркинги</h3>P1: 2,56 €/час, 12,78 €/ден<br><br><div style="background:#fef3c7;padding:10px;border-radius:10px"><b>💡 Съвет:</b> Лятото е ад - юли/август опашки от 1 км. Ела 2.5 часа по-рано!</div>`,
en:`<h3>📍 1 Terminal</h3>Small airport.<br><br><h3>KISS & RIDE</h3><b>0-10 min: 0.00 € FREE</b><br>10-30: 2.05 €<br><br><div style="background:#fef3c7;padding:10px;border-radius:10px"><b>Tip:</b> Summer is hell - July/Aug 1km queue. Come 2.5h early!</div>`
},
boj:{
bg:`<h3>📍 1 Терминал - сезонно (април-октомври)</h3><br>
<h3>💚 KISS & RIDE</h3><b>0-10 мин: 0,00 € БЕЗПЛАТНО</b><br>10-30 мин: 2,56 €<br>30-60 мин: 5,11 €<br><br>
<div style="background:#fef3c7;padding:10px;border-radius:10px"><b>💡 Съвет:</b> Най-натоварено летище лятото! Само бързо слизане, полиция гони ако чакаш.</div>`,
en:`<h3>1 Terminal - seasonal</h3><br><h3>KISS & RIDE</h3><b>0-10 min: 0.00 € FREE</b><br>10-30: 2.56 €<br><br><div style="background:#fef3c7;padding:10px;border-radius:10px"><b>Tip:</b> Busiest in summer! Only quick drop-off.</div>`
},
pdv:{
bg:`<h3>📍 1 Терминал - най-малкото и спокойно</h3>Нискотарифни и чартъри.<br><br>
<h3>💚 KISS & RIDE - НАЙ-ЩЕДРО!</h3>
<b>0-15 мин: 0,00 € БЕЗПЛАТНО</b><br>15-30 мин: 1,53 €<br>30-60 мин: 3,07 €<br><br>
<h3>🅿️ Паркинги</h3>Най-евтини в БГ: 1,02 €/час, 5,11 €/ден<br><br><div style="background:#d1fae5;padding:10px;border-radius:10px"><b>💡 Съвет:</b> Ако можеш избирай Пловдив - няма опашки, безплатно 15 мин и евтин паркинг!</div>`,
en:`<h3>1 Terminal - smallest and calmest</h3><br><h3>KISS & RIDE - MOST GENEROUS!</h3><b>0-15 min: 0.00 € FREE</b><br>15-30: 1.53 €<br><br><div style="background:#d1fae5;padding:10px;border-radius:10px"><b>Tip:</b> Choose Plovdiv if you can - no queues, 15 min free!</div>`
}
};

function setLang(l){L=l;document.querySelectorAll('.lang button').forEach(b=>b.classList.remove('active'));document.getElementById('b-'+l).classList.add('active');document.getElementById('h1').innerText=T[l].h1;document.getElementById('sub').innerText=T[l].sub;render();}
const list=document.getElementById('list'),home=document.getElementById('home'),detail=document.getElementById('detail');
function render(){list.innerHTML="";A.forEach(a=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<b>${a.code}</b><h4 style="margin:6px 0">${a.name[L]}</h4><span class="badge">${a.free[L]}</span><div style="font-size:11px;color:#666;margin-top:6px">→ ${T[L].btn}</div>`;d.onclick=()=>show(a.id);list.appendChild(d);});}
function show(id){const a=A.find(x=>x.id===id);home.style.display='none';detail.style.display='block';window.scrollTo(0,0);
const langInfo = INFO[id][L] || INFO[id]['bg'] || INFO[id]['en'];
detail.innerHTML=`<button class="btn" onclick="back()">${T[L].back}</button>
<h1 style="font-size:26px">${a.name[L]} (${a.code})</h1><p style="margin:10px 0;font-size:20px;font-weight:800;color:#059669">${a.free[L]}</p>
<div class="box"><div class="box-inner" style="line-height:1.7;font-size:14px">${langInfo}</div>
<div style="padding:12px;background:#f8f9fb;display:grid;gap:8px">
<a href="https://www.google.com/maps/search/${a.code}+Airport+Bulgaria" target="_blank" style="background:#0B57D0;color:#fff;padding:14px;border-radius:12px;text-align:center;text-decoration:none;font-weight:800">📍 Open Map / Карта в € зона</a>
<a href="https://www.google.com/maps/dir//${a.code}+Airport" target="_blank" style="background:#fff;border:1px solid #ddd;padding:14px;border-radius:12px;text-align:center;text-decoration:none;font-weight:800;color:#111">🧭 Directions / Упътване</a>
</div>
<iframe style="width:100%;height:260px;border:0" loading="lazy" src="https://maps.google.com/maps?q=${a.code}%20Airport%20Bulgaria&t=&z=14&ie=UTF8&iwloc=&output=embed"></iframe>
</div>`;}
function back(){detail.style.display='none';home.style.display='block';}
setLang('bg');
</script>
</body>
</html>
