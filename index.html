<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Летища България - Kiss & Ride 2026</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#f8f9fb;color:#111}
header{background:#fff;padding:14px 20px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;position:sticky;top:0}
.logo{font-weight:800;color:#0B57D0;text-decoration:none;font-size:20px}
.hero{max-width:900px;margin:0 auto;padding:30px 20px}
.grid{max-width:900px;margin:0 auto;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px;cursor:pointer}
.card:hover{border-color:#0B57D0}
.badge{color:#059669;background:#ecfdf5;padding:2px 8px;border-radius:20px;font-size:12px;display:inline-block;margin-top:6px}
#detail{display:none;max-width:900px;margin:0 auto;padding:20px}
.btn{padding:8px 12px;border:none;background:#eee;border-radius:8px;cursor:pointer;margin-bottom:12px}
.box{border:1px solid #ddd;padding:14px;border-radius:10px;margin-top:12px;background:#fff}
.box.warn{background:#fffbeb}
.box.blue{background:#eff6ff}
footer{text-align:center;padding:30px;color:#777;font-size:12px}
</style>
</head>
<body>
<header><a class="logo" href="/">Letishta.bg</a><div>BG</div></header>
<div id="home">
<div class="hero"><h1>Такси и безплатен престой на летищата в България 2026</h1><p style="color:#555;margin-top:8px">София, Варна, Бургас, Пловдив - Kiss & Ride зони, цени, карти.</p></div>
<div class="grid" id="list"></div>
</div>
<div id="detail"></div>
<footer>© 2026 Letishta.bg - Неофициален сайт | Като dropoffpay.co.uk за БГ</footer>
<script>
const airports=[
{id:"sof",name:"Летище София",code:"SOF",city:"София",free:"10 мин безплатно",price:"5 лв / час след това",p1:"P1 Краткосрочен Т2 - 5 лв/ч",p2:"P2 Многоетажен - 35 лв/ден",p3:"Частен FlyPark - от 12 лв/ден с трансфер"},
{id:"var",name:"Летище Варна",code:"VAR",city:"Варна",free:"10 мин безплатно",price:"3 лв / 30 мин след това",p1:"P1 - 3 лв/30мин / 6 лв/ч",p2:"P2 Дългосрочен - 25 лв/ден",p3:"На бариера - кеш/карта"},
{id:"boj",name:"Летище Бургас",code:"BOJ",city:"Бургас",free:"10 мин безплатно",price:"3 лв / 30 мин след това",p1:"P1 - 3 лв/30мин",p2:"Дългосрочен - 20-25 лв/ден сезонно",p3:"На бариера"},
{id:"pdv",name:"Летище Пловдив",code:"PDV",city:"Пловдив",free:"15 мин безплатно",price:"2 лв / час след това",p1:"P1 - 2 лв/ч / 15 лв/ден",p2:"Много евтино",p3:"Безплатен престой"}
];
const list=document.getElementById('list');
const home=document.getElementById('home');
const detail=document.getElementById('detail');
function render(){
list.innerHTML="";
airports.forEach(a=>{
const d=document.createElement('div');d.className='card';
d.innerHTML=`<b>${a.code}</b> - ${a.city}<h3 style="margin:6px 0">${a.name}</h3><span class="badge">${a.free}</span><div style="font-size:13px;color:#666;margin-top:6px">Натисни за цени</div>`;
d.onclick=()=>show(a.id);list.appendChild(d);
});
}
function show(id){
const a=airports.find(x=>x.id===id);
home.style.display='none';detail.style.display='block';window.scrollTo(0,0);
detail.innerHTML=`<button class="btn" onclick="back()">← Назад</button><h2>${a.name} (${a.code})</h2><p style="margin:8px 0;color:#555">Kiss & Ride: <b>${a.free}</b> - ${a.price}</p><div class="box warn"><h3>🚗 Kiss & Ride / Drop-off</h3><p>${a.free} пред терминала. След това: ${a.price}. Паркирането в зоната е забранено.</p></div><div class="box blue"><h3>🅿️ Паркинг</h3><p>${a.p1}<br>${a.p2}<br>${a.p3}</p></div><div class="box"><h3>Калкулатор 7 дни</h3><p>Официален: ~${id==='sof'?245:id==='var'?175:140} лв<br>Частен: ~84 лв<br><b style="color:green">Спестяваш до 161 лв</b></p></div>`;
}
function back(){detail.style.display='none';home.style.display='block';}
render();
</script>
</body>
</html>
