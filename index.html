const list=document.getElementById('list'),home=document.getElementById('home'),detail=document.getElementById('detail');
function renderHome(){
document.getElementById('h1').innerText=UI[L].title;
document.getElementById('sub').innerText=UI[L].sub;
list.innerHTML="";
Object.keys(AIR).forEach(id=>{
const a=AIR[id];
const d=document.createElement('div');d.className='card';
d.style.cursor='pointer';
d.innerHTML=`<b>${a.code}</b><h4 style="margin:6px 0">${a.names[L]}</h4><span style="background:#ecfdf5;color:#059669;padding:4px 8px;border-radius:20px;font-weight:800;font-size:11px">${a.free[L]}</span>`;
d.onclick=()=>{current=id;show(id);};
list.appendChild(d);
});

}
function show(id){current=id;home.style.display='none';detail.style.display='block';window.scrollTo(0,0);detail.innerHTML=getDetail(id);}
function back(){detail.style.display='none';home.style.display='block';current=null;}
