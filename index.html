.map-btn2{display:block;background:#fff;color:#111;border:1px solid #ddd;text-align:center;padding:12px;border-radius:12px;text-decoration:none;font-weight:800;margin-top:6px}

});

function show(id){currentAirport=id;home.style.display='none';detail.style.display='block';window.scrollTo(0,0);detail.innerHTML=getDetail(id);}
function back(){detail.style.display='none';home.style.display='block';currentAirport=null;}
function setLang(l){L=l;document.querySelectorAll('.lang button').forEach(b=>b.classList.remove('active'));document.getElementById('b-'+l).classList.add('active');renderHome();}
