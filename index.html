<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Летища България 2026</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0B57D0">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3774/3774080.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif}
body{background:#f8f9fb;color:#111}
header{background:#fff;padding:10px 14px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}
.logo{font-weight:800;color:#0B57D0;text-decoration:none;font-size:18px}
.lang{display:flex;gap:4px;flex-wrap:wrap}
.lang button{padding:6px 9px;border:1px solid #ddd;border-radius:20px;background:#fff;cursor:pointer;font-weight:800;font-size:11px}
.lang button.active{background:#0B57D0;color:#fff;border-color:#0B57D0}
.hero{max-width:900px;margin:0 auto;padding:24px 16px}
.grid{max-width:900px;margin:0 auto;padding:0 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:12px;cursor:pointer}
.card:active{transform:scale(0.98)}
.badge{color:#059669;background:#ecfdf5;padding:3px 7px;border-radius:20px;font-size:11px;font-weight:700}
#detail{display:none;max-width:900px;margin:0 auto;padding:16px}
.btn{padding:8px 14px;border:none;background:#e5e7eb;border-radius:20px;cursor:pointer;margin-bottom:14px;font-weight:700}
.box{background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px;margin-top:12px;line-height:1.6}
</style>
</head>
<body>
<header><a class="logo" href="/">Letishta.bg</a>
<div class="lang">
<button onclick="setLang('bg')" id="b-bg" class="active">BG</button>
<button onclick="setLang('en')" id="b-en">EN</button>
<button onclick="setLang('de')" id="b-de">DE</button>
<button onclick="setLang('ro')" id="b-ro">RO</button>
<button onclick="setLang('tr')" id="b-tr">TR</button>
<button onclick="setLang('gr')" id="b-gr">GR</button>
</div></header>

<div id="home">
<div class="hero"><h1 id="h1"></h1><p id="sub" style="color:#555;margin-top:8px;font-size:14px"></p></div>
<div class="grid" id="list"></div>
</div>
<div id="detail"></div>

<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js')}
const T={
bg:{h1:"Такси и безплатен престой 2026",sub:"София, Варна, Бургас, Пловдив - Kiss & Ride, цени, карти",free:"безплатно",btn:"Цени",back:"← Назад"},
en:{h1:"Bulgaria Airport Fees 2026",sub:"Sofia, Varna, Burgas, Plovdiv - Free Kiss & Ride, prices, maps",free:"FREE",btn:"Prices",back:"← Back"},
de:{h1:"Bulgarien Flughafen Gebühren 2026",sub:"Sofia, Varna, Burgas, Plovdiv - Kiss & Ride, Preise",free:"KOSTENLOS",btn:"Preise",back:"← Zurück"},
ro:{h1:"Taxe aeroport Bulgaria 2026",sub:"Sofia, Varna, Burgas, Plovdiv - Kiss & Ride gratuit",free:"GRATUIT",btn:"Prețuri",back:"← Înapoi"},
tr:{h1:"Bulgaristan Havalimanı Ücretleri 2026",sub:"Sofya, Varna, Burgaz, Filibe - Ücretsiz Kiss & Ride",free:"ÜCRETSİZ",btn:"Fiyatlar",back:"← Geri"},
gr:{h1:"Τέλη αεροδρομίου Βουλγαρίας 2026",sub:"Σόφια, Βάρνα, Μπουργκάς, Φιλιππούπολη - Δωρεάν Kiss & Ride",free:"ΔΩΡΕΑΝ",btn:"Τιμές",back:"← Πίσω"}
};
let L='bg';
const A=[
{id:"sof",code:"SOF",name:{bg:"Летище София",en:"Sofia Airport",de:"Flughafen Sofia",ro:"Aeroport Sofia",tr:"Sofya Havalimanı",gr:"Αεροδρόμιο Σόφιας"},free:{bg:"10 мин безплатно",en:"10 min free",de:"10 Min kostenlos",ro:"10 min gratuit",tr:"10 dk ücretsiz",gr:"10 λεπτά δωρεάν"}},
{id:"var",code:"VAR",name:{bg:"Летище Варна",en:"Varna Airport",de:"Flughafen Varna",ro:"Aeroport Varna",tr:"Varna Havalimanı",gr:"Αεροδρόμιο Βάρνας"},free:{bg:"10 мин безплатно",en:"10 min free",de:"10 Min kostenlos",ro:"10 min gratuit",tr:"10 dk ücretsiz",gr:"10 λεπτά δωρεάν"}},
{id:"boj",code:"BOJ",name:{bg:"Летище Бургас",en:"Burgas Airport",de:"Flughafen Burgas",ro:"Aeroport Burgas",tr:"Burgaz Havalimanı",gr:"Αεροδρόμιο Μπουργκάς"},free:{bg:"10 мин безплатно",en:"10 min free",de:"10 Min kostenlos",ro:"10 min gratuit",tr:"10 dk ücretsiz",gr:"10 λεπτά δωρεάν"}},
{id:"pdv",code:"PDV",name:{bg:"Летище Пловдив",en:"Plovdiv Airport",de:"Flughafen Plovdiv",ro:"Aeroport Plovdiv",tr:"Filibe Havalimanı",gr:"Αεροδρόμιο Φιλιππούπολης"},free:{bg:"15 мин безплатно",en:"15 min free",de:"15 Min kostenlos",ro:"15 min gratuit",tr:"15 dk ücretsiz",gr:"15 λεπτά δωρεάν"}}
];
const INFO={
sof:{
bg:"<b>Терминал 2</b> - Kiss & Ride е точно пред входа. Имаш 10 мин безплатно да оставиш пътник. След 10-та минута таксата е 5 лв/час. Ако чакаш повече - ползвай паркинг P4 (по-евтин).",
en:"<b>Terminal 2</b> - Kiss & Ride right in front. 10 min free for drop-off. After 10th min: 5 BGN/hour. For longer wait use P4 parking (cheaper).",
de:"<b>Terminal 2</b> - Kiss & Ride direkt vor dem Eingang. 10 Min kostenlos, danach 5 BGN/Stunde. Für längeres Warten P4 nutzen.",
ro:"<b>Terminal 2</b> - Kiss & Ride chiar în față. 10 min gratuit, apoi 5 BGN/oră. Pentru așteptare lungă folosiți P4.",
tr:"<b>Terminal 2</b> - Kiss & Ride girişin önünde. 10 dk ücretsiz, sonra 5 BGN/saat. Uzun bekleme için P4 otopark.",
gr:"<b>Terminal 2</b> - Kiss & Ride ακριβώς μπροστά. 10 λεπτά δωρεάν, μετά 5 BGN/ώρα. Για μεγάλη αναμονή χρησιμοποιήστε P4."
},
var:{bg:"<b>Летище Варна</b> - безплатната зона е до бариерата. 10 мин безплатно, след това 3 лв на 30 мин. Лятото е голям трафик.",en:"<b>Varna Airport</b> - free zone until barrier. 10 min free, then 3 BGN / 30 min. Heavy traffic in summer.",de:"Varna - 10 Min kostenlos, dann 3 BGN / 30 Min.",ro:"Varna - 10 min gratuit, apoi 3 BGN / 30 min.",tr:"Varna - 10 dk ücretsiz, sonra 3 BGN / 30 dk.",gr:"Βάρνα - 10 λεπτά δωρεάν, μετά 3 BGN / 30 λεπτά."},
boj:{bg:"<b>Летище Бургас</b> - лятото е ад, само за бързо слизане. 10 мин безплатно, после такса. Паркингът е далеч.",en:"<b>Burgas Airport</b> - hell in summer, only quick drop-off. 10 min free then fee. Parking is far.",de:"Burgas - im Sommer sehr voll, nur schneller Ausstieg.",ro:"Burgas - vara e aglomerat, doar oprire rapidă.",tr:"Burgaz - yazın çok kalabalık, sadece hızlı indirme.",gr:"Μπουργκάς - το καλοκαίρι χαμός, μόνο γρήγορη αποβίβαση."},
pdv:{bg:"<b>Летище Пловдив</b> - най-щедро, 15 мин безплатно! Най-малък трафик, най-лесно.",en:"<b>Plovdiv Airport</b> - most generous, 15 min free! Least traffic, easiest.",de:"Plovdiv - am großzügigsten, 15 Min kostenlos!",ro:"Plovdiv - cel mai generos, 15 min gratuit!",tr:"Filibe - en cömert, 15 dk ücretsiz!",gr:"Φιλιππούπολη - πιο γενναιόδωρο, 15 λεπτά δωρεάν!"}
};

function setLang(l){L=l;document.querySelectorAll('.lang button').forEach(b=>b.classList.remove('active'));document.getElementById('b-'+l).classList.add('active');document.getElementById('h1').innerText=T[l].h1;document.getElementById('sub').innerText=T[l].sub;render();}
const list=document.getElementById('list'),home=document.getElementById('home'),detail=document.getElementById('detail');
function render(){list.innerHTML="";A.forEach(a=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<b>${a.code}</b><h4 style="margin:4px 0;font-size:14px">${a.name[L]}</h4><span class="badge">${a.free[L]}</span><div style="font-size:11px;color:#666;margin-top:6px">→ ${T[L].btn}</div>`;d.onclick=()=>show(a.id);list.appendChild(d);});}
function show(id){const a=A.find(x=>x.id===id);home.style.display='none';detail.style.display='block';window.scrollTo(0,0);detail.innerHTML=`<button class="btn" onclick="back()">${T[L].back}</button><h1 style="font-size:28px">${a.name[L]} (${a.code})</h1><p style="margin:12px 0;font-size:20px;font-weight:800;color:#059669">${a.free[L]}</p><div class="box"><div style="font-size:16px">${INFO[id][L]}</div><div style="margin-top:16px;padding:12px;background:#f0f7ff;border-radius:10px"><b>💰 ${T[L].btn}:</b><br>• 0-10 min: <b>${T[L].free}</b><br>• 10-60 min: 5 BGN / 5€<br>• P4 / P5 long term cheaper</div><div style="margin-top:16px;display:grid;gap:8px"><a href="https://www.google.com/maps/search/${a.code}+Airport+Bulgaria" target="_blank" style="background:#0B57D0;color:#fff;padding:12px;border-radius:10px;text-align:center;text-decoration:none;font-weight:800">📍 Open Map / Карта</a><a href="https://www.google.com/maps/dir//${a.code}+Airport" target="_blank" style="background:#fff;border:1px solid #ddd;padding:12px;border-radius:10px;text-align:center;text-decoration:none;font-weight:800;color:#111">🧭 Directions / Упътване</a></div></div>`;}
function back(){detail.style.display='none';home.style.display='block';}
setLang('bg');
</script>
</body>
</html>
